<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Bar Menu </title>
  <!-- <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_left_alt" /> -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />

  <link rel="stylesheet" href="style.css">
</head>

<body >
  <nav class="site-nav" >
       <button class="sidebar-toggle"><span class="material-symbols-rounded">
          menu  
        </span> </button>
  </nav>
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="logo.png" alt="" class="header-logo">
      <button class="sidebar-toggle"><span class="material-symbols-rounded">
          arrow_left_alt
        </span> </button>
    </div>
    <div class="sidebar-content">
      <form action="#" class="search-form">
        <button class="sidebar-togglee"><span class="material-symbols-rounded">
            Search
          </span> </button>

        </button>
        <input type="search" placeholder="search " required>
      </form>
      <ul class="menu-list">
        <li class="menu-item">
          <a href="#" class="menu-link active">
            <span class="material-symbols-rounded">
              dashboard
            </span>
            <span class="menu-label">Dashboard</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="material-symbols-rounded">
              insert_chart
            </span>
            <span class="menu-label">Analytics</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="material-symbols-rounded">
              notifications
            </span>
            <span class="menu-label">Notifications </span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="material-symbols-rounded">
              star
            </span>
            <span class="menu-label">Favourites</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="material-symbols-rounded">
              storefront 
            </span>
            <span class="menu-label">Products</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
            <span class="material-symbols-rounded">
              group
            </span>
            <span class="menu-label">Customers</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link">
              <span class="material-symbols-rounded">
                settings
            </span>
            <span class="menu-label">Settings</span>
          </a>
        </li>
        
      </ul>
    </div>
    <div class="sidebar-footer">
      <button class="theme-toggle">
        <div class="theme-label">
           <span class="theme-icon material-symbols-rounded">
              dark_mode
            </span>
            <span class="theme-text">Dark mode</span>
        </div>
        <div class="theme-toggle-track">
          <div class="theme-toggle-indicator"></div>
        </div>
      </button>
    </div>
  </aside>
  <script src="script.js"></script>
</body>

</html>
